<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleta de Etiquetas</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#e6c200;--bd:#d9dce1;--ok:#15803d;--rd:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mut:#9aa1ab;--bd:#343941}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mut:#9aa1ab;--bd:#343941}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
input{width:100%;font-size:18px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>div{flex:1}
button{font-size:16px;padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700;width:100%;margin-top:12px}
button.s{padding:8px 10px;font-size:14px}
#cam{display:none;margin-top:8px}
video{width:100%;border-radius:8px;background:#000;max-height:260px;object-fit:cover}
.pv{font-size:14px;color:var(--mut);margin-top:8px}
.msg{font-size:13px;margin-top:6px;min-height:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left;word-break:break-all}
.tot{font-size:22px;font-weight:700;text-align:right;margin-top:10px}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>Coleta de Etiquetas</h1>

<div class="card">
  <label for="ref">Referência (leia o código de barras)</label>
  <input id="ref" placeholder="Leitor, câmera ou digite" autocomplete="off" inputmode="text" autofocus>
  <div class="row" style="margin-top:8px">
    <button id="bcam" class="s" style="flex:1">📷 Ler com câmera</button>
    <button id="bfoto" class="s">📸 Foto</button>
    <input id="foto" type="file" accept="image/*" capture="environment" style="display:none">
    <button id="bclr" class="s">Limpar</button>
  </div>
  <div id="cam"><video id="vid" playsinline muted></video></div>
  <div id="ok" style="display:none;background:var(--ok);color:#fff;font-weight:700;padding:12px;border-radius:8px;margin-top:8px;font-size:18px;word-break:break-all"></div>
  <div class="msg" id="msg"></div>

  <div class="row">
    <div><label for="qtd">Peças por caixa/etiqueta</label><input id="qtd" type="number" inputmode="numeric" min="0" placeholder="ex.: 10"></div>
    <div><label for="vol">Nº de volumes</label><input id="vol" type="number" inputmode="numeric" min="1" value="1"></div>
  </div>
  <div class="pv" id="pv">Subtotal: 0</div>
  <button class="p" id="add">Adicionar</button>
</div>

<div class="card">
  <table>
    <thead><tr><th>Referência</th><th>Pç/cx</th><th>Vol</th><th>Total</th><th></th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="tot" id="tot">Total geral: 0</div>
  <div class="act">
    <button class="s" id="csv">Copiar CSV</button>
    <button class="s" id="zero">Zerar lista</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let lista=[];
const ref=$('ref'),qtd=$('qtd'),vol=$('vol'),msg=$('msg');

// Extrai a referência do código lido (ignora prefixos/sufixos comuns)
function limpa(s){return (s||'').trim().replace(/\s+/g,'').toUpperCase();}
function setMsg(t,c){msg.textContent=t;msg.style.color=c||'var(--mut)';}

function preview(){
  const s=(+qtd.value||0)*(+vol.value||0);
  $('pv').textContent='Subtotal: '+s;
}
qtd.oninput=vol.oninput=preview;

function render(){
  const tb=$('tb');tb.innerHTML='';
  let t=0;
  lista.forEach((it,i)=>{
    const sub=it.q*it.v;t+=sub;
    const tr=document.createElement('tr');
    [it.r,it.q,it.v,sub].forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.appendChild(td);});
    const td=document.createElement('td');
    const b=document.createElement('button');b.textContent='✕';b.className='s';
    b.onclick=()=>{lista.splice(i,1);render();};
    td.appendChild(b);tr.appendChild(td);tb.appendChild(tr);
  });
  $('tot').textContent='Total geral: '+t;
}

function adicionar(){
  const r=limpa(ref.value);
  const q=+qtd.value,v=+vol.value;
  if(!r){setMsg('Leia ou digite a referência.','var(--rd)');ref.focus();return;}
  if(!(q>0)){setMsg('Digite a quantidade de peças.','var(--rd)');qtd.focus();return;}
  if(!(v>0)){setMsg('Informe o nº de volumes.','var(--rd)');vol.focus();return;}
  lista.push({r,q,v});
  render();
  ref.value='';qtd.value='';vol.value=1;preview();
  $('ok').style.display='none';pausado=false;
  setMsg('Adicionado: '+r+' ('+q+' × '+v+' = '+(q*v)+')','var(--ok)');
  ref.focus();
}
$('add').onclick=adicionar;
$('bclr').onclick=()=>{ref.value='';ref.focus();};
$('zero').onclick=()=>{if(confirm('Zerar toda a lista?')){lista=[];render();}};

// Leitor USB/Bluetooth: termina com Enter -> vai para a quantidade
ref.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();ref.value=limpa(ref.value);qtd.focus();}
});
qtd.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();vol.focus();}});
vol.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();adicionar();}});

$('csv').onclick=()=>{
  const linhas=['referencia;pecas_por_caixa;volumes;total'].concat(lista.map(i=>[i.r,i.q,i.v,i.q*i.v].join(';')));
  const txt=linhas.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>setMsg('CSV copiado.','var(--ok)')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');setMsg('CSV copiado.','var(--ok)');}catch(e){setMsg('Não foi possível copiar.','var(--rd)');}
    ta.remove();
  });
};

// Câmera
let stream=null,rodando=false,pausado=false;
function achou(txt){
  ref.value=limpa(txt);
  if(navigator.vibrate)navigator.vibrate(80);
  if(rodando)pausado=true;
  $('ok').textContent='✔ ESCANEADO: '+ref.value;$('ok').style.display='block';
  setMsg('Digite as peças e os volumes e toque em Adicionar.');
  qtd.focus();
}
function parar(){
  rodando=false;pausado=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('cam').style.display='none';$('bcam').textContent='📷 Ler com câmera';
}
async function iniciar(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  }catch(e){setMsg('Câmera indisponível. Use leitor ou digite.','var(--rd)');return;}
  const v=$('vid');v.srcObject=stream;await v.play();
  $('cam').style.display='block';$('bcam').textContent='⏹ Parar câmera';
  rodando=true;setMsg('Aponte para o código de barras…');
  if('BarcodeDetector' in window){
    const det=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','itf','codabar','qr_code']});
    (async function loop(){
      while(rodando){
        if(!pausado){try{const r=await det.detect(v);if(r.length)achou(r[0].rawValue);}catch(e){}}
        await new Promise(r=>setTimeout(r,200));
      }
    })();
  }else if(window.ZXing){
    const rd=new ZXing.BrowserMultiFormatReader();
    (async function loop(){
      while(rodando){
        try{const r=await rd.decodeFromVideoElement(v);if(r){achou(r.getText());while(pausado&&rodando)await new Promise(x=>setTimeout(x,200));}}catch(e){await new Promise(r=>setTimeout(r,250));}
      }
    })();
  }else{setMsg('Leitura por câmera não suportada neste navegador.','var(--rd)');}
}
$('bcam').onclick=()=>rodando?parar():iniciar();
$('bfoto').onclick=()=>$('foto').click();
$('foto').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  setMsg('Lendo foto…');
  const url=URL.createObjectURL(f);
  try{
    let txt=null;
    if('BarcodeDetector' in window){
      const bmp=await createImageBitmap(f);
      const r=await new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','itf','codabar','qr_code']}).detect(bmp);
      if(r.length)txt=r[0].rawValue;
    }
    if(!txt&&window.ZXing){
      const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);
      if(r)txt=r.getText();
    }
    if(txt)achou(txt);else setMsg('Não achei código na foto. Tente de novo, mais perto e reto.','var(--rd)');
  }catch(err){setMsg('Não achei código na foto. Tente de novo, mais perto e reto.','var(--rd)');}
  URL.revokeObjectURL(url);e.target.value='';
};
render();preview();
</script>
</body>
</html>
